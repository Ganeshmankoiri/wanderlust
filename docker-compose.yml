version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_DIR: frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    command: ["npm", "run", "dev"]
    # Or if using vite preview with global install:
    # command: ["npm", "start"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_DIR: backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
    command: ["npm", "run", "start"]
