version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: wanderlust-backend
    ports:
      - "5000:5000"
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: wanderlust-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
